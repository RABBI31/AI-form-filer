<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Form Filler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f14;
      --surface:   #1a1a24;
      --surface-2: #22223a;
      --border:    rgba(255,255,255,0.06);
      --text:      #e8e8f0;
      --text-dim:  #8888a4;
      --accent:    #6366f1;
      --accent-2:  #818cf8;
      --success:   #34d399;
      --danger:    #f87171;
      --warning:   #fbbf24;
      --radius:    12px;
    }

    body {
      width: 380px;
      min-height: 420px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Header ────────────────────────────────────────── */
    .header {
      padding: 20px 20px 16px;
      background: linear-gradient(135deg, rgba(99,102,241,0.15) 0%, rgba(129,140,248,0.05) 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(99,102,241,0.2), transparent 70%);
      border-radius: 50%;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-text p {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ── Actions ───────────────────────────────────────── */
    .actions {
      padding: 16px 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px 0;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      position: relative;
      overflow: hidden;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-fill {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,0.25);
    }
    .btn-fill:hover:not(:disabled) { box-shadow: 0 6px 24px rgba(99,102,241,0.4); }

    .btn-clear {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-clear:hover:not(:disabled) { background: #2a2a44; }

    .btn-detect {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-weight: 500;
    }
    .btn-detect:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }

    /* ── Status ────────────────────────────────────────── */
    .status-bar {
      margin: 0 20px 12px;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.25s ease;
    }
    .status-bar.visible { display: flex; }
    .status-bar.success { background: rgba(52,211,153,0.1); color: var(--success); border: 1px solid rgba(52,211,153,0.15); }
    .status-bar.error   { background: rgba(248,113,113,0.1); color: var(--danger);  border: 1px solid rgba(248,113,113,0.15); }
    .status-bar.info    { background: rgba(99,102,241,0.1);  color: var(--accent-2); border: 1px solid rgba(99,102,241,0.15); }

    /* ── Fields Panel ──────────────────────────────────── */
    .panel {
      margin: 0 20px 16px;
    }
    .panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .field-list {
      max-height: 220px;
      overflow-y: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .field-list::-webkit-scrollbar { width: 4px; }
    .field-list::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }

    .field-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .field-item:last-child { border-bottom: none; }
    .field-item:hover { background: rgba(99,102,241,0.04); }

    .field-label {
      font-size: 12.5px;
      font-weight: 500;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99,102,241,0.12);
      color: var(--accent-2);
    }

    .empty-state {
      padding: 32px 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12.5px;
    }
    .empty-state .icon { font-size: 28px; margin-bottom: 8px; }

    /* ── Footer ────────────────────────────────────────── */
    .footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── Animations ────────────────────────────────────── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-row">
      <div class="logo">🤖</div>
      <div class="header-text">
        <h1>AI Form Filler</h1>
        <p>Smart fake data for any form</p>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-fill" id="btn-fill">
      <span>⚡</span> Fill Fields
    </button>
    <button class="btn btn-clear" id="btn-clear">
      <span>✕</span> Clear
    </button>
  </div>
  <div class="actions" style="padding-top: 0;">
    <button class="btn btn-detect" id="btn-detect" style="flex: 1;">
      <span>🔍</span> Detect Fields
    </button>
  </div>

  <!-- Status -->
  <div class="status-bar" id="status"></div>

  <!-- Detected Fields -->
  <div class="panel" id="panel-fields" style="display: none;">
    <div class="panel-title">Detected Fields</div>
    <div class="field-list" id="field-list"></div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" id="empty-state">
    <div class="icon">📋</div>
    <p>Click <strong>Detect Fields</strong> to scan the page<br />or <strong>Fill Fields</strong> to auto-fill instantly.</p>
  </div>

  <!-- Footer -->
  <div class="footer">AI Form Filler v1.0 — works on any website</div>

  <script src="popup.js"></script>
</body>
</html>
